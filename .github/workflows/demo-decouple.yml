name: Decoupling demo (temporary)

# Temporary, for the RB/WR decoupling port only.  Delete before merging to main.
# Runs the team and players sections in scratch copies of the repo with an Indiana team season forced to be
# refused (A: its cfbstats third-down attempts raised by 1, so the real validator in update.py refuses it;
# B: update.team_season refuses it directly, for when cfbstats is behind and no cross-check runs), once
# with this branch's collect_tabs.py and once with main's, and prints what each stored.  Commits nothing.

on:
  push:
    branches: ["claude/rbwr-decouple"]

permissions:
  contents: read

jobs:
  demo:
    if: contains(github.event.head_commit.message, '[demo]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Forced-refusal scenarios
        run: |
          cat > "$RUNNER_TEMP/driver.py" <<'EOF'
          import json, sys
          sys.path.insert(0, ".")
          import collect as C, update as U, collect_tabs as T
          FORCE = int(sys.argv[1])  # argv[2]: "totals" (cfbstats totals forced to disagree) or "store" (update.py refuses directly)
          orig = T.cfb_team_totals
          def forced(Cm, season, cfb):
              tt = orig(Cm, season, cfb)
              if cfb == T.IU_CFB and season == FORCE:
                  tt["totals"]["third_att"] += 1  # simulated source disagreement
                  print(f"DEMO: forced cfbstats third_att +1 for Indiana {season} (cfbstats games {tt['totals']['games']})")
              return tt
          T.cfb_team_totals = forced
          if sys.argv[2] == "store":  # cross-check not active yet (cfbstats behind ESPN): refuse through update.py directly
              orig_ts = U.team_season
              def refuse(x):
                  if str(x["team_id"]) == "84" and int(x["season"]) == FORCE:
                      U.die(f"team-season Indiana {FORCE}: forced refusal (demo), standing in for a team-total disagreement with cfbstats")
                  return orig_ts(x)
              U.team_season = refuse
          C.section("team")(lambda: T.team_seasons(C, U))()
          C.section("players")(lambda: T.players(C, U))()
          json.dump({"failed": C.FAILED, "log": C.LOG}, open("data/last_run.json", "w"), indent=1)
          EOF
          cat > "$RUNNER_TEMP/demo.py" <<'EOF'
          import json, os, shutil, subprocess, sys
          src, tmp = os.getcwd(), os.environ["RUNNER_TEMP"]
          main_tabs = subprocess.run(["git", "show", "origin/main:collect_tabs.py"], cwd=src, check=True, capture_output=True, text=True).stdout
          def scenario(name, code, season, prep, mode):
              d = os.path.join(tmp, name); shutil.copytree(src, d, ignore=shutil.ignore_patterns(".git"))
              if code == "main": open(os.path.join(d, "collect_tabs.py"), "w").write(main_tabs)
              tj = json.load(open(f"{d}/data/team.json")); prep(tj["teams"]["84"]["seasons"]); json.dump(tj, open(f"{d}/data/team.json", "w"), indent=1)
              before = {s: len(v["games"]) for s, v in tj["teams"]["84"]["seasons"].items()}
              r = subprocess.run([sys.executable, os.path.join(tmp, "driver.py"), str(season), mode], cwd=d, capture_output=True, text=True)
              out = r.stdout + r.stderr
              print(f"\n==================== {name}: collect_tabs.py from {'this branch' if code == 'branch' else 'main'}; Indiana {season} forced to be refused ({mode})")
              print("stored Indiana team seasons before:", before)
              for l in out.splitlines():
                  if l.startswith(("DEMO", "REFUSED", "STORED team Indiana", "STORED rb", "STORED wr")) or "[team] Indiana" in l or "[rb]" in l or "[wr]" in l or "[team] FAILED" in l or "[players] FAILED" in l: print("  log:", l[:400])
              lr = json.load(open(f"{d}/data/last_run.json")); print("data/last_run.json failed:", lr["failed"])
              print("  last_run log naming the team season:", [l for l in lr["log"] if "team" in l and "Indiana" in l or "not stored" in l])
              tj = json.load(open(f"{d}/data/team.json")); print("stored Indiana team seasons after:", {s: len(v["games"]) for s, v in tj["teams"]["84"]["seasons"].items()})
              sk = json.load(open(f"{d}/data/skill.json"))
              for tab in ("rb", "wr"):
                  for p in sk[tab]["players"]:
                      if p["season"] == season: print(f"  skill.json {tab} {p['season']} {p['name']}: {len(p['games'])} games, cfbstats season row {'matched' if p.get('cfbstats_row') else 'not compared'} (through {p.get('cfbstats_through')})")
                  if not any(p["season"] == season for p in sk[tab]["players"]): print(f"  skill.json {tab} {season}: NO PLAYERS STORED")
          drop_2025 = lambda s: s.pop("2025")
          def drop_last_2026(s): s["2026"]["games"] = s["2026"]["games"][:-1]
          for code in ("branch", "main"): scenario(f"A-{code}", code, 2025, drop_2025, "totals")
          for code in ("branch", "main"): scenario(f"B-{code}", code, 2026, drop_last_2026, "store")
          EOF
          python "$RUNNER_TEMP/demo.py"
